name: ci

on:
  pull_request:
    paths:
      - "identity-webhook/**"
      - "openmeter-collector/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/bump-version.yml"
  push:
    branches: [main]
    paths:
      - "identity-webhook/**"
      - "openmeter-collector/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/bump-version.yml"

permissions:
  contents: read

jobs:
  identity-webhook:
    name: identity-webhook
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: identity-webhook
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: identity-webhook/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts

  openmeter-collector:
    name: openmeter-collector
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openmeter-collector
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      # `benthos test ./collector.yaml` auto-discovers companion
      # collector_benthos_test.yaml (same stem + _benthos_test suffix).
      - name: Benthos unit tests (identity + fee mapping)
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            -w /work \
            ghcr.io/openmeterio/benthos-collector:latest \
            test --verbose ./collector.yaml ./collector_benthos_test.yaml
