name: bump-version

on:
  workflow_dispatch:
    inputs:
      version:
        description: >
          Semver bump keyword (patch, minor, major, prerelease, …) or an exact
          version (e.g. 0.4.3 or 0.5.0-rc.1). Passed to `npm version` in
          identity-webhook/. Prefer release.yml rc-from-branch for feature-branch
          RCs that should not commit a version bump.
        required: true
        default: patch
        type: string

defaults:
  run:
    working-directory: identity-webhook

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require branch ref
        run: |
          case "${GITHUB_REF}" in
            refs/heads/*) ;;
            *)
              echo "::error::bump-version must run from a branch (Use workflow from: a branch), got ${GITHUB_REF}"
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: identity-webhook/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bump package version
        env:
          VERSION_BUMP: ${{ inputs.version }}
        run: |
          npm version "$VERSION_BUMP" -m "chore(identity-webhook): release v%s"
      - name: Push branch and tag
        run: |
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin --tags
