# Provenance: identity-webhook/package.json "repository.url" must be this GitHub
# repo, or npm returns E422 when verifying the sigstore bundle.
#
# npm auth: Trusted Publishing (OIDC). Configure on npmjs.com for
# livepeer/clearinghouse and workflow filename `release.yml`. Do not set
# secrets.NPM_TOKEN on publish — it overrides OIDC and can cause EOTP.
# See identity-webhook/docs/RELEASING.md.
#
# One trusted publisher per package — keep stable + RC publish in this file.
name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      mode:
        description: >
          publish-tag = publish an existing git tag; rc-from-branch = compute the
          next RC from the npm registry and publish from this branch without
          committing (dist-tag `rc`)
        type: choice
        options:
          - publish-tag
          - rc-from-branch
        default: publish-tag
      tag:
        description: "Existing tag to publish (publish-tag mode), e.g. v0.4.2"
        required: false
        type: string
      bump:
        description: "Base semver bump for rc-from-branch (before -rc.N)"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

defaults:
  run:
    working-directory: identity-webhook

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'publish-tag' && inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: identity-webhook/package-lock.json
          registry-url: "https://registry.npmjs.org"
          scope: "@pymthouse"

      - run: npm ci
      - run: npm test

      - name: Verify package.json repository matches this repo
        run: |
          REPO_URL=$(node -p "require('./package.json').repository.url.replace(/^git\\+/, '')")
          EXPECTED="https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "$REPO_URL" != "$EXPECTED" ]; then
            echo "::error::package.json repository.url must be ${EXPECTED} for npm provenance (got ${REPO_URL})"
            exit 1
          fi

      - name: Resolve publish version (rc-from-branch)
        id: rc
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'rc-from-branch'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node <<'EOF'
          const { execSync } = require("node:child_process");
          const pkg = require("./package.json").name;
          const bump = process.env.BUMP || "patch";
          let versions = [];
          try {
            versions = JSON.parse(
              execSync(`npm view ${pkg} versions --json`, { encoding: "utf8" }),
            );
            if (!Array.isArray(versions)) versions = [versions];
          } catch {
            versions = [];
          }
          const parseStable = (v) => {
            const m = /^(\d+)\.(\d+)\.(\d+)$/.exec(String(v));
            return m
              ? { maj: Number(m[1]), min: Number(m[2]), pat: Number(m[3]) }
              : null;
          };
          const cmpStable = (a, b) =>
            a.maj - b.maj || a.min - b.min || a.pat - b.pat;
          const stables = versions
            .map(parseStable)
            .filter(Boolean)
            .sort(cmpStable);
          const latestParts = stables.at(-1) || { maj: 0, min: 0, pat: 0 };
          const { maj, min, pat } = latestParts;
          let nextMaj = maj;
          let nextMin = min;
          let nextPat = pat;
          if (bump === "major") {
            nextMaj += 1;
            nextMin = 0;
            nextPat = 0;
          } else if (bump === "minor") {
            nextMin += 1;
            nextPat = 0;
          } else {
            nextPat += 1;
          }
          const base = `${nextMaj}.${nextMin}.${nextPat}`;
          const rcs = versions
            .filter((v) => String(v).startsWith(`${base}-rc.`))
            .map((v) => Number(String(v).slice(base.length + 4)))
            .filter((n) => Number.isFinite(n));
          const nextRc = rcs.length ? Math.max(...rcs) + 1 : 0;
          process.stdout.write(`${base}-rc.${nextRc}`);
          EOF
          )
          npm version "$VERSION" --no-git-tag-version --ignore-scripts
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved RC version ${VERSION} (bump=${BUMP})"

      - name: Verify tag matches package.json version
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish-tag')
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::publish-tag mode requires a tag input (e.g. v0.4.2)"
            exit 1
          fi
          VER=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${VER}"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${VER} (expected ${EXPECTED_TAG})"
            exit 1
          fi

      - name: Install npm CLI for trusted publishing
        run: npm install -g npm@11.5.1

      - name: Publish to npm via OIDC (trusted publishing)
        id: publish
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG}@${VERSION}" version >/dev/null 2>&1; then
            echo "Package ${PKG}@${VERSION} already on npm; skipping publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$VERSION" in
            *-*) npm publish --access public --no-git-checks --ignore-scripts --tag rc ;;
            *)   npm publish --access public --no-git-checks --ignore-scripts ;;
          esac
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "Published ${PKG}@${VERSION}"

      - name: Create GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish-tag')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if gh release view "${TAG}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists on ${GITHUB_REPOSITORY}; skipping create."
            exit 0
          fi
          PRERELEASE_FLAG=""
          case "$VER" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          gh release create "${TAG}" \
            -R "${GITHUB_REPOSITORY}" \
            --title "${PKG} v${VER}" \
            --generate-notes \
            --verify-tag \
            $PRERELEASE_FLAG

      - name: Summarize RC publish
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'rc-from-branch'
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          {
            echo "## RC published"
            echo ""
            echo "- Package: \`${PKG}@${VER}\`"
            echo "- Dist-tag: \`rc\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Install: \`npm i ${PKG}@${VER}\` or \`npm i ${PKG}@rc\`"
            echo ""
            echo "No git tag or version commit was created (detached RC)."
          } >> "$GITHUB_STEP_SUMMARY"
