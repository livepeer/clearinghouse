version: 2
updates:
  - package-ecosystem: gomod
    directory: /openmeter-collector/builder-api
    schedule:
      interval: weekly
    # Never install a release younger than a week: gives the ecosystem time
    # to detect and yank compromised versions before we ever resolve them.
    cooldown:
      default-days: 7
    # One combined PR per week instead of one per package.
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /identity-webhook
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories:
      - /identity-webhook
      - /kafka
      - /openmeter-collector
      - /remote-signer
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-images:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One combined PR; action majors are routine tag moves and CI
    # validates the grouped PR anyway.
    groups:
      actions:
        patterns:
          - "*"
